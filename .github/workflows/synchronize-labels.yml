name: Synchronize Labels

on:
  push:
    branches:
      - main
      - v*
    paths:
      - .github/labels.yml
  workflow_dispatch: {}

jobs:
  synchronize:
    name: Synchronize Labels
    runs-on:
      - ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
