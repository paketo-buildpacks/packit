name: Create or Update Draft Release

on:
  push:
    branches:
    - main
    - v*
    - '!v*-*'
  repository_dispatch:
    types: [ version-bump ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the release to cut (e.g. 1.2.3)'
        required: false

concurrency: release

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod

    - name: Read options
      id: options
      run: |
        setup_qemu=false
        if [[ -f scripts/options.json ]]; then
          setup_qemu="$(jq -r '.setup_qemu // false' scripts/options.json)"
        fi
        echo "setup_qemu=${setup_qemu}" >> "${GITHUB_OUTPUT}"

    - name: Set up QEMU
      if: steps.options.outputs.setup_qemu == 'true'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Run Unit Tests
      run: ./scripts/unit.sh

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: unit
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-tags: true
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
    - name: Reset Draft Release
      id: reset
      uses: paketo-buildpacks/github-config/actions/release/reset-draft@main
      with:
        repo: ${{ github.repository }}
        token: ${{ github.token }}
    - name: Calculate Semver Tag
      if: github.event.inputs.version == ''
      id: semver
      uses: paketo-buildpacks/github-config/actions/tag/calculate-semver@main
      with:
        repo: ${{ github.repository }}
        token: ${{ github.token }}
        ref-name: ${{ github.ref_name }}
    - name: Set Release Tag
      id: tag
      run: |
        tag="${{ github.event.inputs.version }}"
        if [ -z "${tag}" ]; then
          tag="${{ steps.semver.outputs.tag }}"
        fi
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
    - name: Generate Release Notes
      env:
        GH_TOKEN: ${{ secrets.PAKETO_BOT_GITHUB_TOKEN }}
      run: |
        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          "/repos/${{ github.repository }}/releases/generate-notes" \
          -f tag_name="v${{ steps.tag.outputs.tag }}" \
          -f target_commitish="${{ github.sha }}" \
          --jq .body > release_notes.md
    - name: Check for package script
      id: package
      run: |
        exists=false
        if [[ -f scripts/package.sh ]]; then
          exists=true
        fi
        echo "exists=${exists}" >> "${GITHUB_OUTPUT}"
    - name: Package
      if: steps.package.outputs.exists == 'true'
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: ./scripts/package.sh --version "${TAG}"
    - name: Create Release Assets
      id: assets
      if: steps.package.outputs.exists == 'true'
      run: |
        assets="$(find build -type f -printf '%P\n' | jq -R -s -c '
          split("\n")
          | map(select(length > 0))
          | map({
              path: ("build/" + .),
              name: .,
              content_type: "application/octet-stream"
            })
        ')"
        printf 'assets=%s\n' "${assets}" >> "${GITHUB_OUTPUT}"
    - name: Create Release
      uses: paketo-buildpacks/github-config/actions/release/create@main
      with:
        repo: ${{ github.repository }}
        token: ${{ secrets.PAKETO_BOT_GITHUB_TOKEN }}
        tag_name: v${{ steps.tag.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: v${{ steps.tag.outputs.tag }}
        body_filepath: release_notes.md
        draft: true
        assets: ${{ steps.assets.outputs.assets || '[]' }}

  failure:
    name: Alert on Failure
    runs-on: ubuntu-24.04
    needs: [ unit, release ]
    if: ${{ always() && needs.unit.result == 'failure' || needs.release.result == 'failure' }}
    permissions:
      issues: write
    steps:
    - name: File Failure Alert Issue
      uses: paketo-buildpacks/github-config/actions/issue/file@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repo: ${{ github.repository }}
        label: "failure:release"
        comment_if_exists: true
        issue_title: "Failure: Create Draft Release workflow"
        issue_body: |
          Create Draft Release workflow [failed](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}).
        comment_body: |
           Another failure occurred: https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}
